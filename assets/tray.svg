<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <!-- Template (alpha-only) tray glyph. Template images keep alpha and drop
       color, so the mark is carried by shape alone: the CRT frame with the
       block cursor and the 63% integrity rule knocked through it. Scanlines
       are omitted here — at 16pt they alias into mush. -->
  <defs>
    <mask id="knockout">
      <rect width="96" height="96" fill="#fff"/>
      <rect x="26" y="30" width="20" height="26" fill="#000"/>
      <rect x="54" y="38" width="16" height="6" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#knockout)">
    <rect x="12" y="18" width="72" height="50" fill="#000"/>
  </g>
  <rect x="12" y="74" width="45" height="8" fill="#000"/>
  <rect x="59" y="74" width="25" height="8" fill="#000" opacity="0.45"/>
</svg>
