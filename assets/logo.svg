<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- OSIRIS.EXE logo on transparent — the app mark without the tile.
       Same canon grammar: duat-black screen, phosphor block cursor, one hard
       contact edge against crimson at 63%. -->
  <defs>
    <clipPath id="screen"><rect x="4" y="10" width="112" height="100"/></clipPath>
    <pattern id="scan120" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="2" fill="#00FF46" opacity="0.10"/>
    </pattern>
  </defs>
  <g clip-path="url(#screen)">
    <rect x="4" y="10" width="112" height="100" fill="#010103"/>
    <rect x="4" y="10" width="112" height="100" fill="url(#scan120)"/>
    <rect x="20" y="34" width="54" height="4" fill="#D8D2C4" opacity="0.34"/>
    <rect x="20" y="44" width="36" height="4" fill="#D8D2C4" opacity="0.20"/>
    <rect x="20" y="58" width="14" height="4" fill="#00FF46"/>
    <rect x="41" y="52" width="18" height="24" fill="#00FF46"/>
    <rect x="20" y="88" width="48" height="6" fill="#00FF46"/>
    <rect x="68" y="88" width="28" height="6" fill="#FF3A1A"/>
  </g>
</svg>
